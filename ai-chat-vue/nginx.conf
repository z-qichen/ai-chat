# ============================================================
# Nginx 配置 —— 前端静态服务 + API 反向代理
#
# 两条核心规则:
#   location /     → 返回 Vue SPA 静态文件
#   location /api/  → 反向代理到后端容器 (backend:4000)
# ============================================================

server {
    listen 80;
    server_name localhost;

    # ---- gzip 压缩 ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # ---- 安全响应头 ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' fonts.googleapis.com; font-src 'self' fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' wss:; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # ---- 前端静态文件 + SPA 路由回退 ----
    location / {
        root /usr/share/nginx/html;
        index index.html;

        # try_files 执行逻辑:
        #   1. 先尝试找 $uri 对应的文件     (如 /assets/index.js → 直接返回)
        #   2. 找不到找 $uri/ 目录索引       (如 /assets/ → 列出目录)
        #   3. 都找不到返回 /index.html     (如 /chat/123 → index.html, Vue Router 接管)
        #
        # 第三步是 SPA 的关键：前端路由 /chat/123 在磁盘上没有对应文件,
        # 必须回退到 index.html, 然后 Vue Router 解析 URL 渲染对应页面
        try_files $uri $uri/ /index.html;

        # 静态资源缓存（带 hash 的文件永久缓存）
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # ---- API 反向代理到后端 ----
    location /api/ {
        # backend 是 docker-compose 中定义的服务名,
        # Docker 内部 DNS 会自动解析为后端容器的 IP
        proxy_pass http://backend:4000;

        # 使用 HTTP/1.1（支持 keep-alive 和 SSE）
        proxy_http_version 1.1;

        # 把原始请求头透传给后端
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 信任 Caddy 传递的真实 IP
        set_real_ip_from 10.0.0.0/8;
        set_real_ip_from 172.16.0.0/12;
        set_real_ip_from 192.168.0.0/16;
        real_ip_header X-Forwarded-For;

        # === SSE 流式输出的关键配置 ===
        # 默认 Nginx 会缓冲后端响应, 攒够了再一次性发给浏览器
        # AI 对话是逐字生成的 (Server-Sent Events), 必须关闭缓冲
        proxy_buffering off;
        proxy_cache off;

        # 等待后端响应的最长时间 (秒)
        # AI 可能思考很久才出第一个字, 设长一点
        proxy_read_timeout 300s;
    }

    # ---- 屏蔽敏感文件 ----
    location ~ /\. {
        deny all;
    }
}
