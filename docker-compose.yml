# ============================================================
# docker-compose.yml  —— 一键编排前后端容器
#
# 使用方法:
#   1. 在 ai-chat-server/ 下创建 .env 文件 (复制 .env.example 并填写)
#   2. docker compose up -d
#   3. 浏览器打开 http://服务器IP
#   4. docker compose down 停止
#
# 注意: 构建上下文为项目根目录，pnpm-lock.yaml 在根目录
# ============================================================

services:
  # ==================== 后端服务 ====================
  backend:
    image: ghcr.io/${GITHUB_REPOSITORY:-user/ai-chat}-backend:latest
    build:
      context: .                          # 根目录作为构建上下文
      dockerfile: ai-chat-server/Dockerfile
    container_name: ai-chat-backend
    restart: unless-stopped
    env_file:
      - ai-chat-server/.env               # 从 .env 文件加载 API Key 等敏感配置
    environment:
      PORT: 4000
      HOST: 0.0.0.0
      NODE_ENV: production
      DATABASE_PATH: /app/data/ai-chat.db
      UPLOAD_DIR: /app/data/files
      MAX_FILE_SIZE: 10485760
    volumes:
      # SQLite 数据库 + 上传文件持久化到宿主机 ./data 目录
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ==================== 前端服务 ====================
  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY:-user/ai-chat}-frontend:latest
    build:
      context: .
      dockerfile: ai-chat-vue/Dockerfile
    container_name: ai-chat-frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ==================== 自动备份服务 ====================
  backup:
    image: alpine:3.20
    container_name: ai-chat-backup
    restart: no
    volumes:
      - ./data:/data:ro
      - ./backups:/backups
      - ./scripts/backup-db.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache sqlite tar
        echo "0 3 * * * /backup.sh >> /var/log/cron.log 2>&1" | crontab -
        crond -f
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
