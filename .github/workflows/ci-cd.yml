name: CI/CD

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

env:
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ${{ github.repository }}-backend
  IMAGE_NAME_FRONTEND: ${{ github.repository }}-frontend

jobs:
  # ===== 代码检查 =====
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint || echo "⚠️ lint 未配置，跳过"
      - run: pnpm -r typecheck || echo "⚠️ typecheck 未配置，跳过"

  # ===== 构建与推送 Docker 镜像 =====
  build-and-push:
    needs: lint
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - context: .
            dockerfile: ai-chat-server/Dockerfile
            image-suffix: backend
          - context: .
            dockerfile: ai-chat-vue/Dockerfile
            image-suffix: frontend
    steps:
      - uses: actions/checkout@v4
      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 提取元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}-${{ matrix.service.image-suffix }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===== 部署到服务器 (SSH) =====
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment: production
    steps:
      - name: 部署到生产服务器
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/ai-chat
            git pull

            # 首次部署生成 JWT_SECRET，后续部署复用已有的（避免用户 Token 失效）
            if [ -f ai-chat-server/.env ] && grep -q "^JWT_SECRET=" ai-chat-server/.env; then
              EXISTING_JWT=$(grep "^JWT_SECRET=" ai-chat-server/.env | head -1)
            else
              EXISTING_JWT="JWT_SECRET=$(head -c 64 /dev/urandom | base64 | tr -d '+/=' | head -c 64)"
            fi
            echo "$EXISTING_JWT" > .env.tmp
            echo "DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}" >> .env.tmp
            mv .env.tmp ai-chat-server/.env

            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
            docker system prune -f
